<!DOCTYPE html>

    <title>First Conference - Minh Tran</title>
    <link rel="icon" href="../data/icon.png">
    <link rel="stylesheet" href="../styles.css">
    <script>
        (function() {
            if (localStorage.getItem('theme') !== 'light')
                document.documentElement.setAttribute('data-theme', 'dark');
        })();
        function toggleTheme() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            var btn = document.querySelector('.theme-toggle');
            if (btn) btn.textContent = isDark ? 'dark' : 'light';
        }
    </script>
</head>

            </ul>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"><script>document.write(localStorage.getItem('theme')==='light'?'dark':'light')</script></button>
