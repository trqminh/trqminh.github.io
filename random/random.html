<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random - Minh Tran</title>
    <link rel="icon" href="../data/icon.png">
    <link rel="stylesheet" href="../styles.css">
    <script>
        (function() {
            if (localStorage.getItem('theme') !== 'light')
                document.documentElement.setAttribute('data-theme', 'dark');
        })();
        function toggleTheme() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            var btn = document.querySelector('.theme-toggle');
            if (btn) btn.textContent = isDark ? 'dark' : 'light';
        }
    </script>
</head>
<body>
    <header>
        <nav aria-label="Primary navigation">
            <ul>
                <li><a href="../index.html">home</a></li>
                <li><a href="../publications.html">research</a></li>
                <li><a href="random.html" aria-current="page">random</a></li>
            </ul>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"><script>document.write(localStorage.getItem('theme')==='light'?'dark':'light')</script></button>
        </nav>
    </header>

    <main>
        <h1>Random</h1>
        <ul>
            <li><a href="chelsea_cwc.html">Chelsea CWC, June 2025</a></li>
            <li><a href="home.html">Home, December 2024</a></li>
            <li><a href="first_conf.html">First Conference, February 2022</a></li>
        </ul>
    </main>
</body>
</html>
